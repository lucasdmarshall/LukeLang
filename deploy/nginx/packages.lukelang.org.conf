# packages.lukelang.org — static package registry for mimo forge
# Installed alongside lukelang.conf. Cert must include this name:
#   certbot --nginx -d lukelang.org -d www.lukelang.org -d status.lukelang.org -d packages.lukelang.org --expand

server {
    server_name packages.lukelang.org;

    root /var/www/lukelang/packages;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;

    index index.html index.json;
    charset utf-8;
    access_log /var/log/nginx/lukelang-packages.access.log;
    error_log  /var/log/nginx/lukelang-packages.error.log;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /index.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.tar\.gz$ {
        default_type application/gzip;
        add_header Cache-Control "public, max-age=86400";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name packages.lukelang.org;
    return 301 https://$host$request_uri;
}
